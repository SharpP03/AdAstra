name: Auto Weekly Tag

on:
  issues:
    types: [opened, reopened, closed]
  schedule:
    # Run every Monday at 00:05 UTC to update open issues
    - cron: '5 0 * * 1'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  tag-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Calculate Current Week Tag
        id: week
        run: |
          CURRENT_WEEK=$(date +'%Y-W%V')
          echo "current_week=$CURRENT_WEEK" >> $GITHUB_OUTPUT

      - name: Ensure Label Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_WEEK: ${{ steps.week.outputs.current_week }}
        run: |
          gh label create "$CURRENT_WEEK" --color "0E8A16" --description "Auto-generated weekly tag" || true

      - name: Tag Issue on Event (opened, closed, reopened)
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CURRENT_WEEK: ${{ steps.week.outputs.current_week }}
        run: |
          # Fetch existing labels
          LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')

          # Remove old week labels (pattern YYYY-Wxx)
          for lbl in $LABELS; do
            if [[ "$lbl" =~ ^[0-9]{4}-W[0-9]{2}$ && "$lbl" != "$CURRENT_WEEK" ]]; then
              gh issue edit "$ISSUE_NUMBER" --remove-label "$lbl"
            fi
          done

          # Add current week label
          gh issue edit "$ISSUE_NUMBER" --add-label "$CURRENT_WEEK"

      - name: Update Open Issues (Monday schedule or manual dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_WEEK: ${{ steps.week.outputs.current_week }}
        run: |
          # Fetch only OPEN issues (closed tasks stay frozen in their finished week)
          OPEN_ISSUES=$(gh issue list --state open --json number --jq '.[].number')

          for ISSUE_NUMBER in $OPEN_ISSUES; do
            LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '.labels[].name')
            for lbl in $LABELS; do
              if [[ "$lbl" =~ ^[0-9]{4}-W[0-9]{2}$ && "$lbl" != "$CURRENT_WEEK" ]]; then
                gh issue edit "$ISSUE_NUMBER" --remove-label "$lbl"
              fi
            done
            gh issue edit "$ISSUE_NUMBER" --add-label "$CURRENT_WEEK"
          done
