name: Auto Weekly Tag

on:
  issues:
    types: [opened, reopened, closed]
  schedule:
    # Run every Monday at 00:05 UTC to update open issues
    - cron: '5 0 * * 1'
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  issues: write

jobs:
  tag-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Apply Weekly Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RAW_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # 1. Wyznaczenie i walidacja bieżącego tygodnia ISO
          CURRENT_WEEK=$(date +'%Y-W%V')
          if [[ ! "$CURRENT_WEEK" =~ ^[0-9]{4}-W[0-9]{2}$ ]]; then
            echo "::error::Niepoprawny format taga tygodnia: '$CURRENT_WEEK'"
            exit 1
          fi

          # 2. Upewnienie się, że etykieta istnieje w repozytorium
          gh label create "$CURRENT_WEEK" --color "0E8A16" --description "Auto-generated weekly tag" --force

          # 3. Ustalenie listy numerów issue do przetworzenia z walidacją wejścia
          declare -a TARGET_ISSUES=()

          if [[ "$EVENT_NAME" == "issues" ]]; then
            # Ścisła walidacja publicznego wejścia (tylko dodatnie liczby całkowite)
            if [[ ! "$RAW_ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Otrzymano nieprawidłowy numer issue: '$RAW_ISSUE_NUMBER'"
              exit 1
            fi
            TARGET_ISSUES=("$RAW_ISSUE_NUMBER")
          else
            # Dla harmonogramu lub ręcznego wywołania pobieramy otwarte issues
            OPEN_ISSUES=$(gh issue list --state open --limit 200 --json number --jq '.[].number')
            while IFS= read -r num; do
              [[ -n "$num" ]] && TARGET_ISSUES+=("$num")
            done <<< "$OPEN_ISSUES"
          fi

          if [[ ${#TARGET_ISSUES[@]} -eq 0 ]]; then
            echo "Brak zgłoszeń do przetworzenia."
            exit 0
          fi

          # 4. Przetworzenie zgłoszeń (usunięcie starych tagów tygodniowych i dodanie bieżącego)
          for issue in "${TARGET_ISSUES[@]}"; do
            echo "Przetwarzanie issue #$issue..."

            # Pobieramy etykiety i bezpiecznie wyciągamy tylko stare tagi tygodnia za pomocą jq
            OLD_LABELS=$(gh issue view "$issue" --json labels --jq \
              --arg current "$CURRENT_WEEK" \
              '.labels[] | select(.name | test("^[0-9]{4}-W[0-9]{2}$")) | select(.name != $current) | .name')

            # Budujemy listę argumentów do usunięcia starych etykiet
            REMOVE_ARGS=()
            while IFS= read -r lbl; do
              if [[ -n "$lbl" ]]; then
                REMOVE_ARGS+=(--remove-label "$lbl")
              fi
            done <<< "$OLD_LABELS"

            # Aktualizujemy etykiety jednym wywołaniem
            if [[ ${#REMOVE_ARGS[@]} -gt 0 ]]; then
              gh issue edit "$issue" --add-label "$CURRENT_WEEK" "${REMOVE_ARGS[@]}"
            else
              gh issue edit "$issue" --add-label "$CURRENT_WEEK"
            fi
          done
