name: Auto Weekly Tag

on:
  issues:
    types: [opened, reopened, closed]
  schedule:
    # Run every Monday at 00:05 UTC to update open issues
    - cron: '5 0 * * 1'
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  issues: write

jobs:
  tag-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Apply Weekly Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RAW_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          # 1. Wyznaczenie taga tygodnia (np. 2026-W39) i upewnienie się, że etykieta istnieje
          WEEK_TAG=$(date +'%Y-W%V')
          gh label create "$WEEK_TAG" --color "0E8A16" --description "Auto-generated weekly tag" --force

          # 2. Wybór zgłoszeń do otagowania (z walidacją wejścia)
          if [[ "$EVENT_NAME" == "issues" ]]; then
            # Bezpieczeństwo: sprawdzamy, czy numer issue to wyłącznie cyfry
            [[ "$RAW_ISSUE_NUMBER" =~ ^[0-9]+$ ]] || { echo "Nieprawidłowy numer issue: $RAW_ISSUE_NUMBER"; exit 1; }
            ISSUES="$RAW_ISSUE_NUMBER"
          else
            # W poniedziałki pobieramy wszystkie otwarte zgłoszenia
            ISSUES=$(gh issue list --state open --limit 200 --json number -q '.[].number')
          fi

          # 3. Aktualizacja etykiet dla każdego zgłoszenia
          for issue in $ISSUES; do
            echo "Aktualizacja issue #$issue..."

            # Znajdź stare tagi tygodnia (np. 2026-W38) i je usuń
            OLD_TAGS=$(gh issue view "$issue" --json labels -q '.labels[].name' | grep -E '^[0-9]{4}-W[0-9]{2}$' | grep -v "^$WEEK_TAG$" || true)
            for old in $OLD_TAGS; do
              gh issue edit "$issue" --remove-label "$old"
            done

            # Dodaj bieżący tag tygodnia
            gh issue edit "$issue" --add-label "$WEEK_TAG"
          done
